# Disposable integration snapshot only. Feature branches retain their own code
# and upstream workflow unchanged. Hosted Macs execute CPU/VM tests only.
name: Combined runtime integration validation

on:
  push:
    branches: [ci/runtime-composition-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-composition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Combined CPU tests, sanitizers and native builds
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GAME: 010015100B514000
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify integration revision and runner
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p logs
          git show --no-patch --format=fuller HEAD | tee logs/revision.log
          sw_vers
          xcodebuild -version
          clang --version
          sysctl hw.pagesize
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install Python test dependencies
        run: python -m pip install lz4 capstone fonttools
      - name: Bounds, registration and ReportValue CPU regressions
        if: ${{ !cancelled() }}
        run: |
          make -C dm/gfx/tests check_t_pool_range check_t_pool_registration_identity check_report_value 2>&1 | tee logs/portable-gfx.log
          for src in dm/gfx/tests/t_pool_range.c dm/gfx/nvn/tests/t_pool_registration.c dm/gfx/tests/t_report_value.c; do
            name=$(basename "$src" .c)
            clang -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic -I dm/gfx/nvn/include -fsanitize=address,undefined "$src" -o "$RUNNER_TEMP/${name}_san"
            "$RUNNER_TEMP/${name}_san" 2>&1 | tee "logs/${name}-san.log"
          done
      - name: Production index-cache and dirty-tracker regressions
        if: ${{ !cancelled() }}
        run: |
          CC=clang python dm/gfx/tests/test_index_cache_lifetime.py 2>&1 | tee logs/index-cache.log
          CC=clang CFLAGS='-O1 -g -fsanitize=address,undefined' python dm/gfx/tests/test_index_cache_lifetime.py 2>&1 | tee logs/index-cache-san.log
      - name: Production address-manager and SVC sanitizers
        if: ${{ !cancelled() }}
        run: |
          make -C dm/host/tests address-space address-space-svc 2>&1 | tee logs/address-space.log
          make -C dm/host/tests address-space-sanitize address-space-svc-sanitize 2>&1 | tee logs/address-space-sanitize.log
          make -C dm/host/tests address-space-tsan address-space-svc-tsan 2>&1 | tee logs/address-space-tsan.log
      - name: MapMemory source-ownership regressions and sanitizers
        if: ${{ !cancelled() }}
        run: |
          make -C dm/host/tests map-memory 2>&1 | tee logs/map-memory.log
          make -C dm/host/tests map-memory-sanitize 2>&1 | tee logs/map-memory-sanitize.log
          make -C dm/host/tests map-memory-tsan 2>&1 | tee logs/map-memory-tsan.log
      - name: Full host CPU unit tests
        if: ${{ !cancelled() }}
        run: make -C dm/host/tests GAME="$GAME" -j3 run 2>&1 | tee logs/host-tests.log
      - name: Native VM and CPU-only gfx tests
        if: ${{ !cancelled() }}
        working-directory: dm/gfx/tests
        run: |
          tests="t_dirty_registration t_dirty_slots t_dirty_race t_pace t_fstep t_hmap t_cover t_pso_skey t_refl t_rt_range_ro"
          make GAME="$GAME" -j3 $tests 2>&1 | tee ../../../logs/gfx-cpu-build.log
          failed=0
          for t in $tests; do
            echo "::group::$t"
            ./$t 2>&1 | tee "../../../logs/$t.log" || { echo "::error::$t failed"; failed=1; }
            echo "::endgroup::"
          done
          clang -O1 -g -Wall -Wno-unused-function -I../nvn/include -I../../host/gen/"$GAME" -fsanitize=undefined t_dirty_registration.c ../../host/crash.c -o "$RUNNER_TEMP/t_dirty_registration_ubsan"
          "$RUNNER_TEMP/t_dirty_registration_ubsan" 2>&1 | tee ../../../logs/dirty-registration-ubsan.log
          exit $failed
      - name: Full Python tool and profile regression suites
        if: ${{ !cancelled() }}
        env:
          DM_GAME: ${{ env.GAME }}
        run: |
          failed=0
          for f in dm/tools/tests/test_*.py dm/ios/tests/test_*.py dm/gfx/tests/test_*.py; do
            echo "::group::$f"
            python -m unittest -v "$f" 2>&1 | tee "logs/$(basename "$f").log" || { echo "::error::$f failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
      - name: Native Mac host builds for NVN, Vulkan and OpenGL
        if: ${{ !cancelled() }}
        run: |
          for g in 010015100B514000 0100535012974000 010014E00DB56000; do
            echo "::group::dmhost $g"
            make -C dm/host GAME=$g -j3 dmhost 2>&1 | tee "logs/dmhost-$g.log"
            test -x dm/host/dmhost
            echo "::endgroup::"
          done
      - name: Every gfx regression compiled, never GPU-executed
        if: ${{ !cancelled() }}
        working-directory: dm/gfx/tests
        run: |
          tests=$(sed -n 's/^\(t_[a-z0-9_]*\):.*/\1/p' Makefile | sort -u)
          echo "$tests" | tr '\n' ' '; echo
          make GAME="$GAME" -j3 $tests 2>&1 | tee ../../../logs/gfx-all-build.log
      - name: iOS host source compilation only, no signing
        if: ${{ !cancelled() }}
        run: python dm/ios/tools/compile_check.py 2>&1 | tee logs/ios-compile.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: combined-runtime-integration-logs
          path: logs
          retention-days: 7
      # Hosted runners lack Metal 4. t_pool_bounds, t_pool_registration, t_nvn,
      # t_index_cache_lifetime and the remaining GPU tests are compile-only.
      # Passing this workflow does not establish GPU execution or gameplay safety.
